<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simoka Music</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
    padding-bottom:120px;
}

header{
    height:70px;
    background:#101010;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

nav a{
    color:#aaa;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    max-width:1000px;
    margin:auto;
    padding:60px 20px;
    display:grid;
    grid-template-columns:350px 1fr;
    gap:50px;
    align-items:center;
}

.cover{
    width:100%;
    aspect-ratio:1;
    border-radius:20px;
    background:linear-gradient(135deg,#fff,#444,#050505);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 20px 60px rgba(255,255,255,.08);
}

.cover h2{
    font-size:42px;
}

.cover p{
    color:#aaa;
    margin-top:8px;
}

.hero h1{
    font-size:52px;
    margin-bottom:15px;
}

.hero p{
    color:#aaa;
    line-height:1.7;
    margin-bottom:25px;
}

.socials{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.socials a{
    color:white;
    text-decoration:none;
    border:1px solid #333;
    padding:11px 16px;
    border-radius:25px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:0 20px;
}

.search{
    width:100%;
    padding:15px 20px;
    background:#151515;
    border:1px solid #292929;
    border-radius:30px;
    color:white;
    outline:none;
    margin-bottom:35px;
}

h2{
    margin-bottom:20px;
}

.song{
    background:#111;
    border:1px solid #222;
    border-radius:16px;
    padding:15px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:15px;
}

.song-cover{
    width:65px;
    height:65px;
    border-radius:10px;
    background:linear-gradient(135deg,#eee,#222);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.song-info{
    flex:1;
}

.song-info h3{
    margin-bottom:5px;
}

.song-info p{
    color:#777;
    font-size:13px;
}

.play{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:white;
    color:black;
    font-size:17px;
}

.favorite{
    background:none;
    color:#aaa;
    font-size:22px;
}

.favorite.active{
    color:#ff3b6b;
}

.player{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111;
    border-top:1px solid #292929;
    padding:12px 5%;
    z-index:10;
}

.player-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:15px;
}

.player-cover{
    width:55px;
    height:55px;
    border-radius:8px;
    background:linear-gradient(135deg,#eee,#222);
    display:flex;
    align-items:center;
    justify-content:center;
}

.player-info{
    width:160px;
}

.player-info span{
    color:#777;
    font-size:12px;
}

.controls{
    display:flex;
    gap:10px;
    align-items:center;
}

.controls button{
    background:none;
    border:0;
    color:white;
    font-size:20px;
}

.main-play{
    background:white!important;
    color:black!important;
    width:42px;
    height:42px;
    border-radius:50%;
}

.progress{
    flex:1;
}

.progress input{
    width:100%;
}

footer{
    text-align:center;
    padding:40px;
    color:#555;
}

@media(max-width:700px){

    nav{
        display:none;
    }

    .hero{
        grid-template-columns:1fr;
        padding-top:35px;
    }

    .hero h1{
        font-size:40px;
    }

    .player-info{
        width:100px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
🎵 SIMOKA MUSIC
</div>

<nav>
<a href="#accueil">Accueil</a>
<a href="#musiques">Musiques</a>
</nav>

</header>


<section class="hero" id="accueil">

<div class="cover">

<div>

<h2>SIMOKA</h2>

<p>MUSIC</p>

</div>

</div>

<div>

<h1>Simoka</h1>

<p>
Bienvenue sur Simoka Music.
Découvre mes morceaux, mes nouveautés
et retrouve-moi sur les réseaux.
</p>

<div class="socials">

<a href="https://youtube.com/" target="_blank">
▶ YouTube
</a>

<a href="https://open.spotify.com/" target="_blank">
Spotify
</a>

<a href="https://www.tiktok.com/" target="_blank">
TikTok
</a>

</div>

</div>

</section>


<main class="container">

<input
class="search"
id="search"
placeholder="🔎 Rechercher un morceau..."
onkeyup="searchSongs()">


<h2 id="musiques">
🎵 Dernières sorties
</h2>


<div class="song" data-title="Je Pense">

<div class="song-cover">
♪ 
</div>

<div class="song-info">

<h3>Je Pense</h3>

<p>Simoka • 2026</p>

</div>

<button
class="play"
onclick="playSong(0)">
▶
</button>

<button
class="favorite"
onclick="favorite(this)">
♡
</button>

</div>


<div class="song" data-title="Nouveau Son">

<div class="song-cover">
♪
</div>

<div class="song-info">

<h3>Nouveau Son</h3>

<p>Simoka • 2026</p>

</div>

<button
class="play"
onclick="playSong(1)">
▶
</button>

<button
class="favorite"
onclick="favorite(this)">
♡
</button>

</div>

</main>


<footer>

© 2026 Simoka Music

</footer>


<div class="player">

<div class="player-inner">

<div class="player-cover">
♪ 
</div>

<div class="player-info">

<strong id="playerTitle">
Je Pense
</strong>

<br>

<span>
Simoka
</span>

</div>

<div class="controls">

<button onclick="previousSong()">
⏮
</button>

<button
id="playButton"
class="main-play"
onclick="togglePlay()">
▶
</button>

<button onclick="nextSong()">
⏭
</button>

</div>

<div class="progress">

<input
id="progress"
type="range"
min="0"
max="100"
value="0"
oninput="changeProgress()">

</div>

</div>

</div>


<audio id="audio"></audio>


<script>

const songs = [

{
title:"Je Pense",
file:"sons/je-pense.mp3"
},

{
title:"Nouveau Son",
file:"sons/nouveau-son.mp3"
}

];

let currentSong = 0;

const audio =
document.getElementById("audio");


function loadSong(index){

currentSong = index;

audio.src = songs[index].file;

document.getElementById("playerTitle")
.innerText = songs[index].title;

}


function playSong(index){

loadSong(index);

audio.play();

document.getElementById("playButton")
.innerText = "⏸";

}


function togglePlay(){

if(audio.paused){

audio.play();

document.getElementById("playButton")
.innerText = "⏸";

}else{

audio.pause();

document.getElementById("playButton")
.innerText = "▶";

}

}


function nextSong(){

currentSong++;

if(currentSong >= songs.length){
currentSong = 0;
}

playSong(currentSong);

}


function previousSong(){

currentSong--;

if(currentSong < 0){
currentSong = songs.length - 1;
}

playSong(currentSong);

}


audio.addEventListener("timeupdate",function(){

if(audio.duration){

document.getElementById("progress").value =
(audio.currentTime / audio.duration) * 100;

}

});


function changeProgress(){

if(audio.duration){

audio.currentTime =
(document.getElementById("progress").value / 100)
* audio.duration;

}

}


audio.addEventListener("ended",function(){

nextSong();

});


function favorite(button){

button.classList.toggle("active");

button.innerText =
button.classList.contains("active")
? "♥"
: "♡";

}


function searchSongs(){

const search =
document.getElementById("search")
.value.toLowerCase();

document.querySelectorAll(".song")
.forEach(function(song){

const title =
song.dataset.title.toLowerCase();

song.style.display =
title.includes(search)
? "flex"
: "none";

});

}


loadSong(0);

</script>

</body>
</html>
